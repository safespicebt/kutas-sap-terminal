name: Android APK Build (Zebra SAP Terminal)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4
    - name: Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    - name: APK Derle
      run: gradle assembleDebug --stacktrace
    - name: Hazır APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Kutas-SAP-Zebra-Terminal-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    - name: Otomatik GitHub Release Oluştur
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: KUTAŞ SAP Zebra Terminal v1.0.${{ github.run_number }}
        body: Zebra TC21 / TC25 / TC26 SAP Terminal Hazır APK
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
